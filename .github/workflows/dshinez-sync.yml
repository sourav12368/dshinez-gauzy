name: Sync D’Shinez with Gauzy

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dshinez-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'ever-co/ever-gauzy' && github.ref == 'refs/heads/dshinez'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dshinez
          fetch-depth: 0
          filter: blob:none
      - name: Merge upstream and check the brand integration
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash tools/dshinez/sync-upstream.sh
      - name: Publish the merged branch
        run: git push origin HEAD:refs/heads/dshinez
